# 前端(Telegram Mini App / H5 静态站)
# 放到 /etc/nginx/sites-available/,软链到 sites-enabled/,再 certbot --nginx 加 TLS
server {
    listen 80;
    server_name tg.ttgame.fun;

    root /var/www/ttearn;      # 前端 dist 内容放这里
    index index.html;

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # TON Connect manifest 必须公网可取,允许跨域读取
    location = /tonconnect-manifest.json {
        add_header Access-Control-Allow-Origin *;
        default_type application/json;
    }

    # SPA 回退:所有前端路由交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
